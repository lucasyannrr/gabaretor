name: gabaretor
description: "Answer key correction has never been more easy with Gabaretor. FREE and made for teachers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  camera: ^0.12.1
  camera_desktop: ^2.0.0
  dartcv4: ^2.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  pdf: ^3.10.0
  printing: ^5.11.0
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_gen: ^5.15.0
  hive_ce_flutter: ^2.4.0
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  flutter_litert: ^3.9.3
hooks:
  user_defines:
    dartcv4:
      treeshake: true
      include_modules:
        - imgproc
        - imgcodecs

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Gabarito
      fonts:
        - asset: assets/fonts/Gabarito-Regular.ttf
        - asset: assets/fonts/Gabarito-Bold.ttf
          weight: 700
  
  assets:
    - assets/mnist_digits.tflite